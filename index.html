<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hunter — Travel Tracker</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --panel-2: #1f2630;
      --border: #2a313c;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #79c0ff;
      --accent-2: #a5d6ff;
      --danger: #f85149;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
    h1 { font-size: 28px; margin: 0; letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 14px; }
    .stats { display: flex; gap: 12px; margin: 16px 0 24px; flex-wrap: wrap; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 120px; }
    .stat .n { font-size: 22px; font-weight: 600; }
    .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    form { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    form .full { grid-column: 1 / -1; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    input, textarea {
      width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      padding: 8px 10px; border-radius: 8px; font: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 60px; }
    button {
      background: var(--accent); color: #0b0f14; border: none; padding: 9px 16px; border-radius: 8px;
      font-weight: 600; cursor: pointer; font: inherit;
    }
    button:hover { background: var(--accent-2); }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 400; }
    button.ghost:hover { color: var(--text); border-color: var(--text); }
    button.danger { background: transparent; color: var(--danger); border: 1px solid transparent; padding: 4px 8px; }
    button.danger:hover { border-color: var(--danger); }
    .trips { display: flex; flex-direction: column; gap: 10px; }
    .trip { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .trip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .trip-where { font-size: 17px; font-weight: 600; }
    .trip-when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .trip-notes { color: var(--muted); margin-top: 6px; font-size: 14px; white-space: pre-wrap; }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; border: 1px dashed var(--border); border-radius: 12px; }
    .row { display: flex; gap: 8px; align-items: center; }
    footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
    footer a { color: var(--muted); }
    @media (max-width: 560px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Hunter — Travel Tracker</h1>
        <div class="sub">Where you've been. Where you're headed.</div>
      </div>
      <div class="row">
        <button class="ghost" id="export">Export</button>
        <button class="ghost" id="import-btn">Import</button>
        <input type="file" id="import" accept="application/json" style="display:none" />
      </div>
    </header>

    <div class="stats">
      <div class="stat"><div class="n" id="stat-trips">0</div><div class="l">Trips</div></div>
      <div class="stat"><div class="n" id="stat-places">0</div><div class="l">Places</div></div>
      <div class="stat"><div class="n" id="stat-nights">0</div><div class="l">Nights away</div></div>
    </div>

    <form id="trip-form">
      <div>
        <label for="where">Destination</label>
        <input id="where" name="where" placeholder="Tokyo, Japan" required />
      </div>
      <div>
        <label for="start">Start</label>
        <input id="start" name="start" type="date" required />
      </div>
      <div>
        <label for="end">End</label>
        <input id="end" name="end" type="date" />
      </div>
      <div>
        <label for="notes">Notes</label>
        <input id="notes" name="notes" placeholder="Optional" />
      </div>
      <div class="full row" style="justify-content: flex-end;">
        <button type="submit">Add trip</button>
      </div>
    </form>

    <div class="trips" id="trips"></div>

    <footer>v1 · data lives in your browser · <a href="https://github.com/BimRoss/hunter">source</a></footer>
  </div>

<script>
(() => {
  const KEY = "hunter.trips.v1";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const save = (t) => localStorage.setItem(KEY, JSON.stringify(t));
  let trips = load();

  const $ = (id) => document.getElementById(id);
  const fmt = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
  const nights = (s, e) => {
    if (!s || !e) return 0;
    const ms = new Date(e) - new Date(s);
    return Math.max(0, Math.round(ms / 86400000));
  };

  function render() {
    const list = $("trips");
    const sorted = [...trips].sort((a, b) => (b.start || "").localeCompare(a.start || ""));
    if (!sorted.length) {
      list.innerHTML = '<div class="empty">No trips yet. Add your first above.</div>';
    } else {
      list.innerHTML = sorted.map(t => `
        <div class="trip">
          <div class="trip-head">
            <div class="trip-where"></div>
            <div class="row">
              <span class="trip-when"></span>
              <button class="danger" data-id="${t.id}" aria-label="Delete">×</button>
            </div>
          </div>
          ${t.notes ? '<div class="trip-notes"></div>' : ""}
        </div>
      `).join("");
      // safe text insertion
      [...list.querySelectorAll(".trip")].forEach((el, i) => {
        const t = sorted[i];
        el.querySelector(".trip-where").textContent = t.where;
        el.querySelector(".trip-when").textContent = t.end ? `${fmt(t.start)} → ${fmt(t.end)}` : fmt(t.start);
        const n = el.querySelector(".trip-notes");
        if (n) n.textContent = t.notes;
      });
    }
    $("stat-trips").textContent = trips.length;
    $("stat-places").textContent = new Set(trips.map(t => t.where.trim().toLowerCase())).size;
    $("stat-nights").textContent = trips.reduce((s, t) => s + nights(t.start, t.end), 0);
  }

  $("trip-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    const trip = {
      id: crypto.randomUUID(),
      where: f.where.value.trim(),
      start: f.start.value,
      end: f.end.value,
      notes: f.notes.value.trim(),
      created: new Date().toISOString(),
    };
    if (!trip.where || !trip.start) return;
    trips.push(trip);
    save(trips);
    f.reset();
    render();
  });

  document.getElementById("trips").addEventListener("click", (e) => {
    const btn = e.target.closest("button.danger");
    if (!btn) return;
    const id = btn.dataset.id;
    if (!confirm("Delete this trip?")) return;
    trips = trips.filter(t => t.id !== id);
    save(trips);
    render();
  });

  $("export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(trips, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `hunter-trips-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  });

  $("import-btn").addEventListener("click", () => $("import").click());
  $("import").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data)) throw new Error("not an array");
      trips = data;
      save(trips);
      render();
    } catch (err) { alert("Import failed: " + err.message); }
  });

  render();
})();
</script>
</body>
</html>
